# deploy/nginx-grabitui.conf
# Deployed to /etc/nginx/conf.d/grabitui.conf.
# grabitui-upstream.conf (managed by deploy.sh, not this file) holds the
# `upstream grabitui_active { server 127.0.0.1:PORT; }` block.
#
# NOTE: certbot modified the live version of this file on grabitui-prod-1
# in place (added the HTTPS server block + HTTP->HTTPS redirect) during
# the DNS cutover. This committed version is the pre-certbot HTTP-only
# baseline — do NOT re-push it to the box without re-running certbot
# afterward, or you will drop TLS on grabit365.com.

server {
    listen 80;
    server_name grabit365.com;

    location /api/health {
        proxy_pass http://grabitui_active;
        access_log off;
    }

    location / {
        proxy_pass http://grabitui_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
