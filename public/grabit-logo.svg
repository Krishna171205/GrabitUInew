<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" fill="none">

  <!-- ── Icon mark: double-G (plate in G) ── -->
  <!-- Center: (100, 100), outer radius: 72, inner radius: 48 -->

  <!-- Outer G arc: from ~320° going CW around to 0° (right-middle), open right -->
  <!-- 320° point: x=100+72*cos(320°)=100+55.1=155.1, y=100+72*sin(320°)=100-46.3=53.7 -->
  <!-- 0° point (crossbar level): x=172, y=100 -->
  <path
    d="M 155,54 A 72,72 0 1,0 172,100"
    stroke="#3d3d3d" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Outer G crossbar: from center to right edge -->
  <line x1="100" y1="100" x2="172" y2="100" stroke="#3d3d3d" stroke-width="13" stroke-linecap="round"/>

  <!-- Inner G arc: same opening, radius 48 -->
  <!-- 320° point: x=100+48*cos(320°)=100+36.8=136.8, y=100+48*sin(320°)=100-30.9=69.1 -->
  <!-- 0° point: x=148, y=100 -->
  <path
    d="M 137,69 A 48,48 0 1,0 148,100"
    stroke="#3d3d3d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Inner G crossbar -->
  <line x1="100" y1="100" x2="148" y2="100" stroke="#3d3d3d" stroke-width="8" stroke-linecap="round"/>

  <!-- ── Fork (orange, centered in the G circle) ── -->
  <!-- Handle -->
  <line x1="100" y1="152" x2="100" y2="80" stroke="#ff6b00" stroke-width="7" stroke-linecap="round"/>
  <!-- Tine base bridge -->
  <path d="M 82,95 Q 82,100 100,100 Q 118,100 118,95"
    stroke="#ff6b00" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 4 tines -->
  <line x1="82"  y1="68" x2="82"  y2="95" stroke="#ff6b00" stroke-width="5" stroke-linecap="round"/>
  <line x1="91"  y1="62" x2="91"  y2="95" stroke="#ff6b00" stroke-width="5" stroke-linecap="round"/>
  <line x1="109" y1="62" x2="109" y2="95" stroke="#ff6b00" stroke-width="5" stroke-linecap="round"/>
  <line x1="118" y1="68" x2="118" y2="95" stroke="#ff6b00" stroke-width="5" stroke-linecap="round"/>

  <!-- ── Wordmark (stacked below icon) ── -->
  <text
    x="100" y="222"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72" font-weight="900" fill="#3d3d3d"
    letter-spacing="-2" text-anchor="middle">grabit</text>

  <!-- Mask native i-dot and replace with orange dot -->
  <rect x="117" y="164" width="20" height="20" fill="white"/>
  <circle cx="127" cy="172" r="8" fill="#ff6b00"/>

</svg>
