name: Security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      # Report-only during rollout (no --error) so findings surface without
      # blocking. Promote to blocking (append --error) per repo after triage.
      - name: Semgrep scan
        run: semgrep scan --config p/default --config p/secrets --skip-unknown-extensions .
